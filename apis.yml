name: Freshket
description: >-
  Freshket is a Thai agri-food supply chain technology company that operates a
  B2B online marketplace connecting farmers and food producers directly with
  restaurants, hotels, catering operations, and food manufacturers. The platform
  uses technology to manage the fresh-produce and ingredient supply chain more
  efficiently and transparently, giving buyers quality ingredients at fair
  prices with reliable next-day delivery while giving growers better market
  access and pricing. Founded in Bangkok and backed by 500 Global, Freshket
  covers ordering, sourcing, cold-chain logistics, and account management for
  foodservice businesses across Thailand. It was added to the API Evangelist
  network as a portfolio-company lead; as of this enrichment pass Freshket
  publishes a customer-facing web and mobile ordering platform but no public
  developer API, SDKs, or documented API surface.
